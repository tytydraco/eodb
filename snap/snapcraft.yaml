name: eodb
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-eodb: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.eodb # adjust accordingly to your app name

apps:
  eodb:
    command: eodb
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-eodb
parts:
  eodb:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
